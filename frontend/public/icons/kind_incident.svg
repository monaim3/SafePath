<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chhintai: a hand snatching a bag, motion streaks behind it -->
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3a1"/>
      <stop offset="1" stop-color="#e59a5c"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c6b7a"/>
      <stop offset="1" stop-color="#2f3a45"/>
    </linearGradient>
  </defs>

  <!-- motion streaks -->
  <g stroke="#e53935" stroke-linecap="round" opacity="0.75">
    <line x1="3" y1="38" x2="12" y2="38" stroke-width="3"/>
    <line x1="1" y1="45" x2="12" y2="45" stroke-width="3"/>
    <line x1="5" y1="52" x2="13" y2="52" stroke-width="3"/>
  </g>

  <!-- bag, tilted as it is pulled -->
  <g transform="rotate(-14 32 40)">
    <path d="M22 28 C22 15 42 15 42 28" fill="none" stroke="#7b2d26" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 29 H50 L46.5 55 Q46 58 43 58 H21 Q18 58 17.5 55 Z" fill="url(#bag)"/>
    <rect x="15.5" y="29" width="33" height="6" rx="2" fill="#ffffff" opacity="0.28"/>
    <rect x="29" y="34" width="6" height="5" rx="1.5" fill="#ffd166"/>
    <path d="M19 49 H45" stroke="#000" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- arm + fist gripping the handle -->
  <path d="M48 2 L60 10 L52 20 L42 12 Z" fill="url(#sleeve)"/>
  <ellipse cx="41" cy="17" rx="7.5" ry="6.5" fill="url(#skin)"/>
  <g stroke="#b86a35" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M36.5 15.5 Q38 18 41 18.5"/>
    <path d="M37.5 19.5 Q39.5 21.5 42.5 21"/>
  </g>
  <ellipse cx="39" cy="14" rx="3" ry="1.6" fill="#ffffff" opacity="0.45"/>
</svg>
