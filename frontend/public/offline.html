<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06101e">
<title>SafePath — ইন্টারনেট নেই</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(600px 400px at 30% 20%, rgba(34,197,94,.12), transparent 70%), #06101e;
    color: #eef3ff; font: 16px/1.6 "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; text-align: center;
  }
  main { max-width: 380px; }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: #fff; display: grid; place-items: center; margin: 0 auto 20px; }
  .logo img { width: 70px; height: 70px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: #b4c0d8; }
  .en { font-size: 14px; color: #8091b3; margin-top: 14px; }
  button {
    margin-top: 22px; border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-weight: 600;
    color: #fff; background: linear-gradient(90deg, #22c55e, #1a73e8); cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <div class="logo"><img src="/icons/app-192.png" alt=""></div>
  <h1>ইন্টারনেট সংযোগ নেই</h1>
  <p>ম্যাপ আর সতর্কবার্তা দেখাতে SafePath-এর ইন্টারনেট লাগে। সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
  <p class="en">You're offline. SafePath needs the internet to show the map and alerts.</p>
  <button type="button" onclick="location.reload()">আবার চেষ্টা করুন · Try again</button>
</main>
<script>
  // Come back by itself as soon as the connection returns.
  addEventListener("online", () => location.reload());
</script>
</body>
</html>
