# Render Blueprint: the SafePath API on Render's free plan, database on Neon (free).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: safepath-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"  # 512 MB RAM on the free plan
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: DJANGO_ALLOWED_HOSTS
        value: safepath-api.onrender.com
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: SAFEPATH_HASH_SALT
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: DATABASE_URL  # Neon connection string, with ?sslmode=require
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # the Vercel URL, e.g. https://safepath.vercel.app
        sync: false
