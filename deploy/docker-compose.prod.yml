# Production stack for one small server (e.g. Oracle Cloud Always Free VM).
#   cp deploy/.env.example deploy/.env   # then fill in real values
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: safepath
      POSTGRES_USER: safepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepath -d safepath"]
      interval: 5s
      retries: 20
    # No published ports: only the api container can reach the database.

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${API_DOMAIN:?set API_DOMAIN}
      DATABASE_URL: postgres://safepath:${POSTGRES_PASSWORD}@db:5432/safepath
      SAFEPATH_HASH_SALT: ${SAFEPATH_HASH_SALT:?set SAFEPATH_HASH_SALT}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set TURNSTILE_SECRET}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      TRUSTED_PROXY_COUNT: "1"  # Caddy sits in front
    volumes:
      - static:/app/staticfiles

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  static:
  caddy_data:
  caddy_config:
